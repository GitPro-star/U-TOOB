services:
  - type: web
    name: utoob-5
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: utoob-postgres
          property: connectionString
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

databases:
  - name: utoob-postgres
    databaseName: utoob
    user: utoob_user
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
